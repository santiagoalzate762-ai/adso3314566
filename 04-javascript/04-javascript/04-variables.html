<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>01_document</title>
    <link rel="stylesheet" href="/src/css/04-javascript.css">
    <style>
        section {
            ul {
                padding: 0;
            }
            ul li,
            figure.animal {
                background-color: #0006;
                border-radius: 2px;
                height: 25px;
                margin: 2px auto;
                display: flex;
                justify-content: center;
                align-items: center;
                width: 25px;
                zoom: 2.5;
            }
        }
    </style>
</head>
<body>
    <a class="btn-home" href="../index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="#000000" viewBox="0 0 256 256"><path d="M240,208H224V136l2.34,2.34A8,8,0,0,0,237.66,127L139.31,28.68a16,16,0,0,0-22.62,0L18.34,127a8,8,0,0,0,11.32,11.31L32,136v72H16a8,8,0,0,0,0,16H240a8,8,0,0,0,0-16ZM48,120l80-80,80,80v88H160V152a8,8,0,0,0-8-8H104a8,8,0,0,0-8,8v56H48Zm96,88H112V160h32Z"></path></svg>
    </a>
    <main>
        <header>
            <h1>03-get-elements</h1>
            <h2>Accede y manipula elementos HTML usando JavaScript.</h2>
            <section>
            <h3>Type String:    <small class="type-string"></small></h3>
            <h3>Type Number:    <small class="type-number"></small></h3>
            <h3>Type Boolean:   <small class="type-boolean"></small></h3>
            <h3>Type Null:      <small class="type-null"></small></h3>
            <h3>Type Undefined: <small class="type-undefined"></small></h3>
            <h3>Type Array:     <small class="type-array"></small></h3>
            <h3>Type Object:    <small class="type-object"></small></h3>
        </section>
        </header>
    </main>
    <script>
        const tstring = document.querySelector('.type-string');
        const massage = 'hola js ❤️';
        tstring.textContent=`${massage} -> length: ${massage.length} characters`;
    
    
        const tnmber = document.querySelector('.type-number');
        const number = '45';
        const number2 = 12.4;
        tnmber.textContent=`${number} + ${number2} = ${parseInt(number) + number2}`;
    
        const tboolean = document.querySelector('.type-boolean');
        const isTrue = (4>8);
        tboolean.textContent=`4>8 -> ${isTrue}`;

        const tnull = document.querySelector('.type-null');
        const isCreated = null;
        tnull.textContent=`isCreated -> ${isCreated}`;

        const tundefined = document.querySelector('.type-undefined');
        const isBinary=undefined;
        tundefined.textContent=`isBinary -> ${isBinary}`;

        const tarray = document.querySelector('.type-array');
        const fruits = ['🍎','🫐','🍊','🍒'];
        tarray.textContent=`fruits -> ${fruits}`;

        const tobject = document.querySelector('.type-object');
        const hashira = {name:'kyojuro rengoku', age:20, type:'fire'};
        tobject.textContent=`${hashira.name} -> ${hashira.age}`;

    </script>    
</body>
</html>
